name: Build luau binary

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'deobf/build_luau.py'
      - '.github/workflows/build-luau.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les outils de compilation
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++

      - name: Compiler luau (version portable, compatible avec le CPU de Render)
        run: python3 deobf/build_luau.py --portable

      - name: Mettre le binaire à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: luau-linux-binary
          path: deobf/bin/luau
